name: Tech garden chips

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/gen_chips.py"

permissions:
  contents: write

jobs:
  chips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate chips + the README tech-garden block
        run: python3 scripts/gen_chips.py

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chips README.md
          if git diff --cached --quiet; then
            echo "chips unchanged"
            exit 0
          fi
          git commit -m "🖥️ chips sync"
          git push
