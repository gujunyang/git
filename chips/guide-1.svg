<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.5s" fill="freeze"/><text x="76" y="120" font-size="13" font-weight="700" fill="#F2A33C">RAG</text><text x="76" y="137" font-size="12" fill="#8b949e">Look up sources before answering, so the model does less confident nonsense 📚</text><path d="M76 160 H 820" stroke="#F2A33C" stroke-opacity="0.15" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.5s" fill="freeze"/><text x="76" y="182" font-size="13" font-weight="700" fill="#37B59B">Prompt</text><text x="76" y="199" font-size="12" fill="#8b949e">The craft of talking to models. Same model — the prompt decides whether it&#x27;s a genius or an idiot ✍️</text><path d="M76 222 H 820" stroke="#37B59B" stroke-opacity="0.15" stroke-width="1"/></g>
